<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Đăng nhập')}"></head>
<body class="auth-body" th:with="authPage=${true}">
<div th:replace="~{fragments/header :: bar}"></div>
<main class="auth-split" id="content">
    <div class="auth-visual" aria-hidden="true"></div>
    <form th:fragment="modal" class="auth-card" th:action="@{/auth/login}" method="post">
        <button type="button" class="modal-close" data-close aria-label="Đóng">×</button>
        <div class="center">
            <div class="brand" style="justify-content:center;">
                <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path fill="#2563eb" d="M0 28 8 4h6L6 28zM8 4h6l10 24h-6zM18 28 26 4h6l-8 24z"/></svg>
                NOVA SHOP
            </div>
            <p class="muted">Chào mừng bạn trở lại</p>
            <h1>Đăng nhập</h1>
        </div>
        <div th:replace="~{fragments/header :: messages}"></div>
        <p class="flash err" th:if="${loginError}" th:text="${loginError}"></p>
        <p class="flash err" th:if="${loginError == null && param.error != null}">Email hoặc mật khẩu không đúng.</p>
        <p class="flash ok" th:if="${param.logout != null}">Bạn đã đăng xuất.</p>
        <div class="form-grid">
            <label class="field">Email
                <input type="email" name="email" required maxlength="100" autocomplete="username" th:value="${param.email != null ? param.email[0] : ''}">
            </label>
            <label class="field">Mật khẩu
                <input type="password" name="password" required maxlength="32" autocomplete="current-password">
            </label>
            <button class="btn-block" type="submit">Đăng nhập</button>
            <p class="center">Chưa có tài khoản? <a th:href="@{/auth/register}">Tạo tài khoản</a></p>
            <p class="center"><a th:href="@{/}">← Về trang chủ</a></p>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/header :: modals('login')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
