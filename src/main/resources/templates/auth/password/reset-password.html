<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quên mật khẩu')}"></head>
<body th:with="authPage=${true}">
<div th:replace="~{fragments/header :: bar}"></div>
<main class="auth-page" id="content">
    <form class="auth-card" th:action="@{/auth/reset-password}" method="post">
        <h1>Quên mật khẩu</h1>
        <div th:replace="~{fragments/header :: messages}"></div>
        <p class="muted">Nếu email đã đăng ký và đang hoạt động, hệ thống sẽ gửi liên kết đặt lại mật khẩu.</p>
        <label class="field">Email
            <input type="email" name="email" required maxlength="100" th:value="${param.email != null ? param.email[0] : ''}">
        </label>
        <button type="submit">Gửi liên kết</button>
        <p><a th:href="@{/auth/login}">Quay lại đăng nhập</a></p>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
