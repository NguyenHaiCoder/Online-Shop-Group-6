<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Đặt lại mật khẩu')}"></head>
<body th:with="authPage=${true}">
<div th:replace="~{fragments/header :: bar}"></div>
<main class="auth-page" id="content">
    <section class="auth-card" th:if="${tokenValid == false}">
        <h1>Liên kết không dùng được</h1>
        <p>Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</p>
        <a class="btn" th:href="@{/auth/reset-password}">Gửi lại liên kết</a>
    </section>
    <form class="auth-card" th:if="${tokenValid != false}" th:action="@{/auth/rescue}" method="post">
        <h1>Đặt mật khẩu mới</h1>
        <div th:replace="~{fragments/header :: messages}"></div>
        <input type="hidden" name="token" th:value="${token != null ? token : (param.token != null ? param.token[0] : '')}">
        <div class="form-grid">
            <label class="field">Mật khẩu mới
                <input type="password" name="newPassword" required minlength="6" maxlength="32" autocomplete="new-password">
                <small class="hint">6–32 ký tự, có ít nhất một chữ và một số.</small>
            </label>
            <label class="field">Nhập lại mật khẩu
                <input type="password" name="confirmPassword" required minlength="6" maxlength="32" autocomplete="new-password">
            </label>
            <button type="submit">Cập nhật mật khẩu</button>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
