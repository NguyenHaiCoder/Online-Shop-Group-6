<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Đổi mật khẩu')}"></head>
<body th:with="authPage=${true}">
<div th:replace="~{fragments/header :: bar}"></div>
<main class="auth-page" id="content">
    <!--/* Model: passwordErrors (Map field -> message) */-->
    <form th:fragment="modal" class="auth-card" th:action="@{/profile/change-password}" method="post">
        <button type="button" class="modal-close" data-close aria-label="Đóng">×</button>
        <h1>Đổi mật khẩu</h1>
        <div class="form-grid">
            <label class="field">Mật khẩu hiện tại
                <input type="password" name="currentPassword" required maxlength="32" autocomplete="current-password">
                <small class="field-error" th:if="${passwordErrors != null && passwordErrors['currentPassword'] != null}" th:text="${passwordErrors['currentPassword']}"></small>
            </label>
            <label class="field">Mật khẩu mới
                <input type="password" name="newPassword" required minlength="6" maxlength="32" autocomplete="new-password">
                <small class="hint">6–32 ký tự, có ít nhất một chữ và một số. Phải khác mật khẩu hiện tại.</small>
                <small class="field-error" th:if="${passwordErrors != null && passwordErrors['newPassword'] != null}" th:text="${passwordErrors['newPassword']}"></small>
            </label>
            <label class="field">Nhập lại mật khẩu mới
                <input type="password" name="confirmPassword" required minlength="6" maxlength="32" autocomplete="new-password">
                <small class="field-error" th:if="${passwordErrors != null && passwordErrors['confirmPassword'] != null}" th:text="${passwordErrors['confirmPassword']}"></small>
            </label>
            <button type="submit">Lưu mật khẩu</button>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/header :: modals('password')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
