<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Cấu hình')}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content"
         th:with="creating=${#strings.endsWith(#request.requestURI, '/new')},
                  locked=${!#strings.endsWith(#request.requestURI, '/new') && form != null && form.type != null && form.type.name() == 'USER_ROLE'}">
        <header th:replace="~{fragments/staff-menu :: top(${creating} ? 'Thêm cấu hình' : 'Chi tiết cấu hình')}"></header>
        <div th:replace="~{fragments/header :: messages}"></div>
        <form class="card form-grid" th:object="${form}" method="post"
              th:action="${creating} ? @{/admin/settings} : @{|${#request.requestURI}|}">
            <p class="hint" th:if="${locked}">Vai trò có sẵn chỉ sửa được tên, mô tả và thứ tự.</p>
            <input type="hidden" th:if="${locked}" name="type" th:value="*{type}">
            <input type="hidden" th:if="${locked}" name="value" th:value="*{value}">
            <input type="hidden" th:if="${locked}" name="active" th:value="*{active}">
            <label class="field">Nhóm
                <select th:field="*{type}" required th:disabled="${locked}">
                    <option th:each="type : ${T(com.swd392.onlineshop.enums.SettingType).values()}" th:value="${type}" th:text="${type.name()}"></option>
                </select>
                <small class="field-error" th:errors="*{type}"></small>
            </label>
            <label class="field">Tên hiển thị
                <input th:field="*{name}" required maxlength="100">
                <small class="field-error" th:errors="*{name}"></small>
            </label>
            <label class="field">Mã giá trị
                <input th:field="*{value}" required maxlength="100" th:readonly="${locked}">
                <small class="field-error" th:errors="*{value}"></small>
            </label>
            <label class="field">Thứ tự
                <input type="number" th:field="*{displayOrder}">
            </label>
            <label class="field">Mô tả
                <textarea th:field="*{description}" maxlength="500" rows="3"></textarea>
            </label>
            <label class="checks"><input type="checkbox" th:field="*{active}" th:disabled="${locked}"> Đang dùng</label>
            <div class="form-actions">
                <button type="submit" th:text="${creating} ? 'Tạo' : 'Lưu'">Lưu</button>
                <a class="btn btn-ghost" th:href="@{/admin/settings}">Quay lại</a>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
