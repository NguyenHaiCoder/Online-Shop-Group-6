<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Cấu hình hệ thống')}"></head>
<body class="staff-body"><div class="staff-shell"><aside th:replace="~{fragments/staff-menu :: menu}"></aside>
<main class="staff-content" id="content"><header th:replace="~{fragments/staff-menu :: top('Cấu hình hệ thống')}"></header>
<div th:replace="~{fragments/header :: messages}"></div>
<div class="split"><p class="muted">Quản lý các nội dung và thiết lập hiển thị trên website.</p><a class="btn" th:href="@{/admin/settings/new}">＋ Thêm cấu hình</a></div>
<form class="filters card" method="get" th:action="@{/admin/settings}" th:object="${settingFilter}">
<input type="search" th:field="*{keyword}" placeholder="Tìm theo mã hoặc tên cấu hình">
<select th:field="*{type}"><option value="">Tất cả nhóm</option><option th:each="t : ${T(com.swd392.onlineshop.enums.SettingType).values()}" th:value="${t}" th:text="${t}"></option></select>
<select th:field="*{active}"><option value="">Tất cả trạng thái</option><option value="true">Hiển thị</option><option value="false">Ẩn</option></select><button type="submit">Lọc</button><a th:href="@{/admin/settings}">Đặt lại</a>
</form><div class="table-wrap"><table><thead><tr>
<th><a th:replace="~{fragments/pagination :: sort('name', 'Tên cấu hình')}"></a></th><th>Mã cấu hình</th><th>Nhóm</th><th><a th:replace="~{fragments/pagination :: sort('displayOrder', 'Thứ tự')}"></a></th><th>Giá trị</th><th>Trạng thái</th><th>Thao tác</th>
</tr></thead><tbody><tr th:if="${page.empty}"><td colspan="7" class="empty">Chưa có cấu hình phù hợp.</td></tr>
<tr th:each="row : ${page.content}"><td><a th:href="@{|/admin/settings/${row.id}|}" th:text="${row.name}"></a></td><td th:text="${row.code}"></td><td th:text="${row.groupName}"></td><td th:text="${row.displayOrder}"></td><td class="truncate" th:text="${row.value}"></td><td><span th:replace="~{fragments/header :: visibility(${row.active})}"></span></td>
<td class="row-actions"><a th:href="@{|/admin/settings/${row.id}/edit|}">Sửa</a><button type="button" class="btn-ghost" th:attr="data-open=|visibility-${row.id}|" th:text="${row.active} ? 'Ẩn' : 'Hiện'"></button>
<div th:replace="~{fragments/admin :: visibilityDialog('visibility-' + ${row.id}, '/admin/settings/' + ${row.id} + '/toggle', ${row.name}, ${row.active})}"></div></td></tr>
</tbody></table><nav th:replace="~{fragments/pagination :: pager(${page})}"></nav></div></main></div><script th:src="@{/js/ui.js}"></script></body></html>
