<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Người dùng')}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content" th:with="creating=${#strings.endsWith(#request.requestURI, '/new')}">
        <header th:replace="~{fragments/staff-menu :: top(${creating} ? 'Thêm người dùng' : 'Chi tiết người dùng')}"></header>
        <div th:replace="~{fragments/header :: messages}"></div>
        <form class="card form-grid" th:object="${form}" method="post"
              th:action="${creating} ? @{/admin/users} : @{|${#request.requestURI}|}">
            <img class="avatar-lg" th:if="${user != null && user.avatar != null}" th:src="${user.avatar}" alt="">
            <p class="hint" th:if="${!creating}">Khi sửa chỉ đổi được vai trò và trạng thái. Không tự đổi vai trò hoặc tự khóa tài khoản của mình.</p>
            <p class="hint" th:if="${creating}">Mật khẩu ngẫu nhiên sẽ được gửi qua email.</p>
            <label class="field">Họ tên
                <input th:field="*{fullName}" required minlength="2" maxlength="100" th:readonly="${!creating}">
                <small class="field-error" th:errors="*{fullName}"></small>
            </label>
            <label class="field">Email
                <input type="email" th:field="*{email}" required maxlength="100" th:readonly="${!creating}">
                <small class="field-error" th:errors="*{email}"></small>
            </label>
            <input type="hidden" th:if="${!creating}" name="gender" th:value="*{gender}">
            <label class="field">Giới tính
                <select th:field="*{gender}" th:disabled="${!creating}">
                    <option value="">Chọn</option>
                    <option th:each="g : ${T(com.swd392.onlineshop.enums.Gender).values()}" th:value="${g}" th:text="${g.name() == 'MALE' ? 'Nam' : (g.name() == 'FEMALE' ? 'Nữ' : 'Khác')}"></option>
                </select>
            </label>
            <label class="field">Số điện thoại
                <input th:field="*{mobile}" maxlength="15" th:readonly="${!creating}">
            </label>
            <label class="field">Địa chỉ
                <input th:field="*{address}" maxlength="255" th:readonly="${!creating}">
            </label>
            <label class="field">Vai trò
                <select th:field="*{roleId}" required>
                    <option value="">Chọn</option>
                    <option th:each="role : ${roles != null ? roles : T(java.util.Collections).emptyList()}" th:value="${role.id}" th:text="${role.name}"></option>
                </select>
                <small class="field-error" th:errors="*{roleId}"></small>
            </label>
            <label class="field">Trạng thái
                <select th:field="*{status}" required>
                    <option th:each="st : ${T(com.swd392.onlineshop.enums.UserStatus).values()}" th:value="${st}" th:text="${st.name() == 'NOT_VERIFIED' ? 'Chưa xác minh' : (st.name() == 'ACTIVE' ? 'Hoạt động' : 'Đã khóa')}"></option>
                </select>
                <small class="field-error" th:errors="*{status}"></small>
            </label>
            <div class="form-actions">
                <button type="submit" th:text="${creating} ? 'Tạo' : 'Lưu'">Lưu</button>
                <a class="btn btn-ghost" th:href="@{/admin/users}">Quay lại</a>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
