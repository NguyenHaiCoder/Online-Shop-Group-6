<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Người dùng')}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content">
        <header th:replace="~{fragments/staff-menu :: top('Người dùng')}"></header>
        <div th:replace="~{fragments/header :: messages}"></div>
        <div class="split">
            <form class="filters" method="get" th:action="@{/admin/users}">
                <input type="search" name="keyword" placeholder="Tên, email hoặc số điện thoại" th:value="${param.keyword != null ? param.keyword[0] : ''}">
                <select name="gender">
                    <option value="">Mọi giới tính</option>
                    <option value="MALE" th:selected="${param.gender != null && param.gender[0] == 'MALE'}">Nam</option>
                    <option value="FEMALE" th:selected="${param.gender != null && param.gender[0] == 'FEMALE'}">Nữ</option>
                    <option value="OTHER" th:selected="${param.gender != null && param.gender[0] == 'OTHER'}">Khác</option>
                </select>
                <select name="roleId">
                    <option value="">Mọi vai trò</option>
                    <option th:each="role : ${roles != null ? roles : T(java.util.Collections).emptyList()}" th:value="${role.id}" th:text="${role.name}" th:selected="${param.roleId != null && param.roleId[0] == '' + role.id}"></option>
                </select>
                <select name="status">
                    <option value="">Mọi trạng thái</option>
                    <option value="NOT_VERIFIED" th:selected="${param.status != null && param.status[0] == 'NOT_VERIFIED'}">Chưa xác minh</option>
                    <option value="ACTIVE" th:selected="${param.status != null && param.status[0] == 'ACTIVE'}">Hoạt động</option>
                    <option value="INACTIVE" th:selected="${param.status != null && param.status[0] == 'INACTIVE'}">Đã khóa</option>
                </select>
                <button type="submit">Lọc</button>
            </form>
            <a class="btn" th:href="@{/admin/users/new}">Thêm người dùng</a>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th><a th:replace="~{fragments/pagination :: sort('id', 'Mã')}"></a></th>
                    <th><a th:replace="~{fragments/pagination :: sort('fullName', 'Họ tên')}"></a></th>
                    <th><a th:replace="~{fragments/pagination :: sort('gender', 'Giới tính')}"></a></th>
                    <th><a th:replace="~{fragments/pagination :: sort('email', 'Email')}"></a></th>
                    <th><a th:replace="~{fragments/pagination :: sort('mobile', 'Điện thoại')}"></a></th>
                    <th><a th:replace="~{fragments/pagination :: sort('role', 'Vai trò')}"></a></th>
                    <th><a th:replace="~{fragments/pagination :: sort('status', 'Trạng thái')}"></a></th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page == null || page.totalElements == 0}"><td colspan="8" class="empty">Chưa có người dùng.</td></tr>
                <tr th:if="${page != null}" th:each="row : ${page.content}">
                    <td th:text="${row.id}"></td>
                    <td><a th:href="@{|/admin/users/${row.id}|}" th:text="${row.fullName}">Tên</a></td>
                    <td><span th:replace="~{fragments/header :: gender(${row.gender})}"></span></td>
                    <td th:text="${row.email}"></td>
                    <td th:text="${row.mobile}"></td>
                    <td th:text="${row.role != null ? row.role.name : ''}"></td>
                    <td><span th:replace="~{fragments/header :: userStatus(${row.status})}"></span></td>
                    <td><a th:href="@{|/admin/users/${row.id}|}">Sửa</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/pagination :: pager(${page})}"></nav>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
