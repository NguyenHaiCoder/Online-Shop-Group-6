<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Người dùng')}"></head>
<body class="staff-body admin-body"><div class="staff-shell">
<aside th:replace="~{fragments/staff-menu :: menu}"></aside>
<main class="staff-content" id="content">
<header th:replace="~{fragments/staff-menu :: top('Người dùng')}"></header>
<div th:replace="~{fragments/header :: messages}"></div>
<div class="split"><p class="muted">Quản lý thông tin và trạng thái hiển thị của người dùng</p><a class="btn" th:href="@{/admin/users/new}">＋ Thêm người dùng</a></div>
<form class="filters card" method="get" th:action="@{/admin/users}" th:object="${userFilter}">
<input type="search" th:field="*{keyword}" placeholder="Tìm theo mã, họ tên hoặc email">
<select th:field="*{visible}"><option value="">Tất cả trạng thái</option><option value="true">Hiển thị</option><option value="false">Ẩn</option></select>
<select th:field="*{roleId}"><option value="">Tất cả vai trò</option><option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option></select>
<button type="submit">Lọc</button><a th:href="@{/admin/users}">Đặt lại</a>
</form>
<div class="table-wrap"><table><thead><tr>
<th><a th:replace="~{fragments/pagination :: sort('code', 'Mã')}"></a></th>
<th><a th:replace="~{fragments/pagination :: sort('fullName', 'Họ tên & email')}"></a></th>
<th>Vai trò</th><th>Xác minh email</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th>
</tr></thead><tbody>
<tr th:if="${page.empty}"><td colspan="7" class="empty">Chưa có người dùng phù hợp.</td></tr>
<tr th:each="row : ${page.content}">
<td th:text="${row.code}"></td><td><a th:href="@{|/admin/users/${row.id}|}" th:text="${row.fullName}"></a><small class="table-sub" th:text="${row.email}"></small></td>
<td th:text="${row.role.name}"></td><td th:text="${row.emailVerified} ? '✓ Đã xác minh' : 'Chưa xác minh'"></td>
<td><span th:replace="~{fragments/header :: visibility(${row.visible})}"></span></td>
<td><span th:replace="~{fragments/header :: when(${row.createdAt})}"></span></td>
<td class="row-actions"><a th:href="@{|/admin/users/${row.id}/edit|}">Sửa</a>
<button class="btn-ghost" type="button" th:attr="data-open=|visibility-${row.id}|" th:text="${row.visible} ? 'Ẩn' : 'Hiện'"></button>
<div th:replace="~{fragments/admin :: visibilityDialog('visibility-' + ${row.id}, '/admin/users/' + ${row.id} + '/toggle', ${row.fullName}, ${row.visible})}"></div>
</td></tr></tbody></table>
<nav th:replace="~{fragments/pagination :: pager(${page})}"></nav></div>
</main></div><script th:src="@{/js/ui.js}"></script></body></html>
