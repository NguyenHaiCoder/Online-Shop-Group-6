<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Phản hồi')}"></head>
<body class="staff-body">
<link rel="stylesheet" th:href="@{/css/marketing.css}">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content">
        <!--/* MF01 Danh sach phan hoi */-->
        <header th:replace="~{fragments/staff-menu :: top('Phản hồi')}"></header>
        <div class="mk-bar">
            <p class="mk-sub">Quản lý thông tin và trạng thái hiển thị phản hồi</p>
            <a class="btn" th:href="@{/marketing/feedbacks/new}"><span th:replace="~{fragments/marketing :: icon('plus')}"></span>Thêm phản hồi</a>
        </div>
        <div th:replace="~{fragments/header :: messages}"></div>

        <form class="card mk-toolbar" method="get" th:action="@{/marketing/feedbacks}">
            <input type="search" name="keyword" th:value="${filter.keyword}" placeholder="Tìm theo tên, mã hoặc email">
            <select name="visible">
                <option value="">Tất cả trạng thái</option>
                <option value="true" th:selected="${filter.visible == true}">Hiển thị</option>
                <option value="false" th:selected="${filter.visible == false}">Ẩn</option>
            </select>
            <button type="submit">Lọc</button>
        </form>

        <div class="table-wrap">
            <table class="mk-table">
                <thead>
                <tr><th>Mã</th><th>Người gửi &amp; email</th><th>Chủ đề</th><th>Ngày gửi</th><th>Trạng thái</th><th>Thao tác</th></tr>
                </thead>
                <tbody>
                <tr th:if="${page.totalElements == 0}"><td colspan="6" class="empty">Chưa có phản hồi.</td></tr>
                <tr th:each="row : ${page.content}">
                    <td th:text="${row.code}">PH0001</td>
                    <td>
                        <a class="mk-name" th:href="@{|/marketing/feedbacks/${row.id}|}" th:text="${row.fullName}">Người gửi</a>
                        <span class="sub" th:text="${row.email}">email</span>
                    </td>
                    <td class="wrap" th:text="${row.subject}">Chủ đề</td>
                    <td th:text="${#temporals.format(row.createdAt, 'dd/MM/yyyy')}"></td>
                    <td><span th:replace="~{fragments/header :: visibility(${row.visible})}"></span></td>
                    <td>
                        <div class="mk-row-actions">
                            <a class="mk-link" th:href="@{|/marketing/feedbacks/${row.id}/edit|}" title="Chỉnh sửa" aria-label="Chỉnh sửa"><span th:replace="~{fragments/marketing :: icon('edit')}"></span></a>
                            <a class="mk-link" th:if="${row.visible}" href="#" th:attr="data-open=|hide-${row.id}|"><span th:replace="~{fragments/marketing :: icon('eye-off')}"></span>Ẩn</a>
                            <form th:unless="${row.visible}" th:action="@{|/marketing/feedbacks/${row.id}/toggle|}" method="post">
                                <input type="hidden" name="from" value="list">
                                <button class="mk-link" type="submit"><span th:replace="~{fragments/marketing :: icon('eye')}"></span>Hiện</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/pagination :: pager(${page})}"></nav>

        <!--/* MF05 Xac nhan an phan hoi */-->
        <th:block th:each="row : ${page.content}" th:if="${row.visible}">
            <div th:replace="~{fragments/marketing :: hideModal(|hide-${row.id}|, 'Ẩn phản hồi?', ${row.subject},
                    'Phản hồi sẽ không xuất hiện ở các nơi hiển thị công khai. Nội dung vẫn được giữ nguyên.',
                    @{|/marketing/feedbacks/${row.id}/toggle|}, 'list', 'Ẩn phản hồi')}"></div>
        </th:block>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
