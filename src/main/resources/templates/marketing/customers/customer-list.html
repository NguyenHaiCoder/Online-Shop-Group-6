<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Khách hàng')}"></head>
<body class="staff-body">
<link rel="stylesheet" th:href="@{/css/marketing.css}">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content">
        <!--/* MC01 Danh sach khach hang */-->
        <header th:replace="~{fragments/staff-menu :: top('Khách hàng')}"></header>
        <div class="mk-bar">
            <p class="mk-sub">Quản lý thông tin và trạng thái hiển thị của khách hàng</p>
            <a class="btn" th:href="@{/marketing/customers/new}"><span th:replace="~{fragments/marketing :: icon('plus')}"></span>Thêm khách hàng</a>
        </div>
        <div th:replace="~{fragments/header :: messages}"></div>

        <form class="card mk-toolbar" method="get" th:action="@{/marketing/customers}">
            <input type="search" name="keyword" th:value="${filter.keyword}" placeholder="Tìm theo họ tên, mã khách hoặc email">
            <select name="visible">
                <option value="">Tất cả trạng thái</option>
                <option value="true" th:selected="${filter.visible == true}">Hiển thị</option>
                <option value="false" th:selected="${filter.visible == false}">Ẩn</option>
            </select>
            <button type="submit">Lọc</button>
        </form>

        <div class="table-wrap">
            <table class="mk-table">
                <thead>
                <tr><th>Mã khách</th><th>Họ tên</th><th>Điện thoại</th><th>Email</th><th>Ngày tạo</th><th>Trạng thái</th><th>Thao tác</th></tr>
                </thead>
                <tbody>
                <tr th:if="${page.totalElements == 0}"><td colspan="7" class="empty">Chưa có khách hàng.</td></tr>
                <tr th:each="row : ${page.content}">
                    <td class="muted" th:text="${row.code}">KH0001</td>
                    <td><a class="mk-name" th:href="@{|/marketing/customers/${row.id}|}" th:text="${row.fullName}">Họ tên</a></td>
                    <td th:text="${row.mobile}"></td>
                    <td th:text="${row.email}"></td>
                    <td th:text="${#temporals.format(row.createdAt, 'dd/MM/yyyy')}"></td>
                    <td><span th:replace="~{fragments/header :: visibility(${row.visible})}"></span></td>
                    <td>
                        <div class="mk-row-actions">
                            <a class="mk-link" th:href="@{|/marketing/customers/${row.id}/edit|}" title="Chỉnh sửa" aria-label="Chỉnh sửa"><span th:replace="~{fragments/marketing :: icon('edit')}"></span></a>
                            <a class="mk-link" th:if="${row.visible}" href="#" th:attr="data-open=|hide-${row.id}|"><span th:replace="~{fragments/marketing :: icon('eye-off')}"></span>Ẩn</a>
                            <form th:unless="${row.visible}" th:action="@{|/marketing/customers/${row.id}/toggle|}" method="post">
                                <input type="hidden" name="from" value="list">
                                <button class="mk-link" type="submit"><span th:replace="~{fragments/marketing :: icon('eye')}"></span>Hiện</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/pagination :: pager(${page})}"></nav>

        <!--/* MC05 Xac nhan an khach hang */-->
        <th:block th:each="row : ${page.content}" th:if="${row.visible}">
            <div th:replace="~{fragments/marketing :: hideModal(|hide-${row.id}|, 'Ẩn khách hàng?', ${row.fullName},
                    'Hồ sơ khách hàng sẽ được ẩn khỏi danh sách hiển thị. Dữ liệu và tài khoản đăng nhập không bị ảnh hưởng.',
                    @{|/marketing/customers/${row.id}/toggle|}, 'list', 'Ẩn khách hàng')}"></div>
        </th:block>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
