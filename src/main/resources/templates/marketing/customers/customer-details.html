<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Chi tiết khách hàng')}"></head>
<body class="staff-body">
<link rel="stylesheet" th:href="@{/css/marketing.css}">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content">
        <!--/* MC03 Chi tiet khach hang */-->
        <header th:replace="~{fragments/staff-menu :: top('Chi tiết khách hàng')}"></header>
        <div class="mk-bar">
            <a class="mk-back" th:href="@{/marketing/customers}"><span th:replace="~{fragments/marketing :: icon('back')}"></span>Quay lại danh sách</a>
            <div class="mk-actions">
                <a class="btn" th:href="@{|/marketing/customers/${customer.id}/edit|}"><span th:replace="~{fragments/marketing :: icon('edit')}"></span>Chỉnh sửa</a>
                <button th:if="${customer.visible}" type="button" class="mk-outline" data-open="hide-customer"><span th:replace="~{fragments/marketing :: icon('eye-off')}"></span>Ẩn khách hàng</button>
                <form th:unless="${customer.visible}" th:action="@{|/marketing/customers/${customer.id}/toggle|}" method="post">
                    <input type="hidden" name="from" value="detail">
                    <button type="submit" class="mk-outline"><span th:replace="~{fragments/marketing :: icon('eye')}"></span>Hiện khách hàng</button>
                </form>
            </div>
        </div>
        <div th:replace="~{fragments/header :: messages}"></div>

        <section class="card mk-hero">
            <span class="mk-avatar"><span th:replace="~{fragments/marketing :: icon('user')}"></span></span>
            <div class="mk-hero-body">
                <h2><span th:text="${customer.fullName}">Họ tên</span><span th:replace="~{fragments/header :: visibility(${customer.visible})}"></span></h2>
                <p class="muted" th:text="|Mã khách hàng: ${customer.code}|">Mã khách hàng</p>
            </div>
            <div class="mk-hero-side">
                <span>Ngày tạo: <strong th:text="${#temporals.format(customer.createdAt, 'dd/MM/yyyy')}"></strong></span>
                <span>Cập nhật: <strong th:text="${#temporals.format(customer.updatedAt, 'dd/MM/yyyy')}"></strong></span>
            </div>
        </section>

        <section class="card mk-card">
            <h2>Thông tin khách hàng</h2>
            <table class="mk-kv">
                <tr><td>Họ tên</td><td th:text="${customer.fullName}"></td></tr>
                <tr><td>Email</td><td th:text="${customer.email}"></td></tr>
                <tr><td>Số điện thoại</td><td th:text="${customer.mobile}"></td></tr>
                <tr><td>Địa chỉ</td><td th:text="${customer.address}"></td></tr>
            </table>
        </section>

        <section class="card mk-card">
            <h2>Ghi chú</h2>
            <p class="mk-box" th:text="${customer.note != null ? customer.note : 'Chưa có ghi chú.'}"></p>
        </section>

        <!--/* MC05 Xac nhan an khach hang */-->
        <th:block th:if="${customer.visible}">
            <div th:replace="~{fragments/marketing :: hideModal('hide-customer', 'Ẩn khách hàng?', ${customer.fullName},
                    'Hồ sơ khách hàng sẽ được ẩn khỏi danh sách hiển thị. Dữ liệu và tài khoản đăng nhập không bị ảnh hưởng.',
                    @{|/marketing/customers/${customer.id}/toggle|}, 'detail', 'Ẩn khách hàng')}"></div>
        </th:block>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
