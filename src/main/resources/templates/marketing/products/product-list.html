<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Sản phẩm')}"></head>
<body class="staff-body">
<link rel="stylesheet" th:href="@{/css/marketing.css}">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content">
        <!--/* PR01 Danh sach san pham */-->
        <header th:replace="~{fragments/staff-menu :: top('Sản phẩm')}"></header>
        <div class="mk-bar">
            <p class="mk-sub">Quản lý thông tin và trạng thái hiển thị sản phẩm</p>
            <a class="btn" th:href="@{/marketing/products/new}"><span th:replace="~{fragments/marketing :: icon('plus')}"></span>Thêm sản phẩm</a>
        </div>
        <div th:replace="~{fragments/header :: messages}"></div>

        <form class="card mk-toolbar" method="get" th:action="@{/marketing/products}">
            <input type="search" name="keyword" th:value="${filter.keyword}" placeholder="Tìm tên hoặc mã sản phẩm">
            <select name="categoryId">
                <option value="">Tất cả danh mục</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${filter.categoryId == c.id}"></option>
            </select>
            <select name="visible">
                <option value="">Tất cả trạng thái</option>
                <option value="true" th:selected="${filter.visible == true}">Hiển thị</option>
                <option value="false" th:selected="${filter.visible == false}">Ẩn</option>
            </select>
            <button type="submit">Lọc</button>
        </form>

        <div class="table-wrap">
            <table class="mk-table">
                <thead>
                <tr><th>Ảnh</th><th>Mã &amp; tên sản phẩm</th><th>Danh mục</th><th>Giá bán</th><th>Còn bán</th><th>Trạng thái</th><th>Thao tác</th></tr>
                </thead>
                <tbody>
                <tr th:if="${page.totalElements == 0}"><td colspan="7" class="empty">Chưa có sản phẩm.</td></tr>
                <tr th:each="row : ${page.content}">
                    <td><img class="mk-thumb" th:if="${row.thumbnail != null}" th:src="${row.thumbnail}" alt=""></td>
                    <td>
                        <span class="sub" th:text="${row.code}">KB001</span>
                        <a class="mk-name" th:href="@{|/marketing/products/${row.id}|}" th:text="${row.name}">Tên</a>
                    </td>
                    <td th:text="${row.categoryName}">Danh mục</td>
                    <td><strong><span th:replace="~{fragments/header :: vnd(${row.currentPrice})}"></span></strong></td>
                    <td th:text="${row.stockQuantity}">0</td>
                    <td><span th:replace="~{fragments/header :: visibility(${row.visible})}"></span></td>
                    <td>
                        <div class="mk-row-actions">
                            <a class="mk-link" th:href="@{|/marketing/products/${row.id}/edit|}" title="Chỉnh sửa" aria-label="Chỉnh sửa"><span th:replace="~{fragments/marketing :: icon('edit')}"></span></a>
                            <a class="mk-link" th:href="@{|/marketing/products/${row.id}|}" title="Xem chi tiết" aria-label="Xem chi tiết"><span th:replace="~{fragments/marketing :: icon('eye')}"></span></a>
                            <a class="mk-link" th:if="${row.visible}" href="#" th:attr="data-open=|hide-${row.id}|">Ẩn</a>
                            <form th:unless="${row.visible}" th:action="@{|/marketing/products/${row.id}/toggle|}" method="post">
                                <input type="hidden" name="from" value="list">
                                <button class="mk-link" type="submit">Hiện</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/pagination :: pager(${page})}"></nav>

        <!--/* PR05 Xac nhan an san pham */-->
        <th:block th:each="row : ${page.content}" th:if="${row.visible}">
            <div th:replace="~{fragments/marketing :: hideModal(|hide-${row.id}|, 'Ẩn sản phẩm?', ${row.name},
                    'Sản phẩm sẽ không xuất hiện trên website mua sắm. Thông tin trong các đơn đã đặt vẫn được giữ nguyên.',
                    @{|/marketing/products/${row.id}/toggle|}, 'list', 'Ẩn sản phẩm')}"></div>
        </th:block>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
