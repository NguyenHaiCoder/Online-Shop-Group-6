<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Sản phẩm')}"></head>
<body class="staff-body">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content" th:with="creating=${#strings.endsWith(#request.requestURI, '/new')}">
        <header th:replace="~{fragments/staff-menu :: top(${creating} ? 'Thêm sản phẩm' : 'Chi tiết sản phẩm')}"></header>
        <div th:replace="~{fragments/header :: messages}"></div>
        <form class="card form-grid" th:object="${form}" method="post" enctype="multipart/form-data"
              th:action="${creating} ? @{/marketing/products} : @{|${#request.requestURI}|}">
            <img th:if="${product != null && product.thumbnail != null}" th:src="${product.thumbnail}" alt="" style="max-width:240px">
            <label class="field">Ảnh đại diện
                <input type="file" name="thumbnail" accept="image/jpeg,image/png,image/webp">
            </label>
            <div class="gallery" th:if="${product != null}">
                <figure th:each="image : ${product.images}">
                    <img th:src="${image.imageUrl}" alt="">
                    <label><input type="checkbox" name="deleteImageIds" th:value="${image.id}"> Xóa</label>
                </figure>
            </div>
            <label class="field">Ảnh đính kèm
                <input type="file" name="images" accept="image/jpeg,image/png,image/webp" multiple>
            </label>
            <label class="field">Danh mục
                <select th:field="*{categoryId}">
                    <option value="">Chọn</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </label>
            <label class="field">Tên
                <input th:field="*{name}" required maxlength="255">
                <small class="field-error" th:errors="*{name}"></small>
            </label>
            <label class="field">Tóm tắt
                <textarea th:field="*{briefInfo}" maxlength="500" rows="3"></textarea>
            </label>
            <label class="field">Mô tả
                <textarea th:field="*{description}" required rows="8"></textarea>
                <small class="field-error" th:errors="*{description}"></small>
            </label>
            <label class="field">Tồn kho
                <input type="number" th:field="*{stockQuantity}" required min="0">
                <small class="field-error" th:errors="*{stockQuantity}"></small>
            </label>
            <label class="field">Giá niêm yết
                <input type="number" th:field="*{originalPrice}" required min="0" step="1">
                <small class="field-error" th:errors="*{originalPrice}"></small>
            </label>
            <label class="field">Giá khuyến mãi
                <input type="number" th:field="*{salePrice}" min="0" step="1">
                <small class="field-error" th:errors="*{salePrice}"></small>
            </label>
            <div class="checks">
                <label><input type="checkbox" th:field="*{featured}"> Nổi bật</label>
                <label><input type="checkbox" th:field="*{visible}"> Hiển thị</label>
            </div>
            <div class="form-actions">
                <button type="submit" th:text="${creating} ? 'Tạo' : 'Lưu'">Lưu</button>
                <a class="btn btn-ghost" th:href="@{/marketing/products}">Quay lại</a>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
