<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Bài viết')}"></head>
<body class="staff-body">
<link rel="stylesheet" th:href="@{/css/marketing.css}">
<div class="staff-shell">
    <aside th:replace="~{fragments/staff-menu :: menu}"></aside>
    <div class="staff-content" id="content">
        <!--/* MP01 Danh sach bai viet */-->
        <header th:replace="~{fragments/staff-menu :: top('Bài viết')}"></header>
        <div class="mk-bar">
            <p class="mk-sub">Quản lý thông tin và trạng thái hiển thị bài viết.</p>
            <a class="btn" th:href="@{/marketing/posts/new}"><span th:replace="~{fragments/marketing :: icon('plus')}"></span>Thêm bài viết</a>
        </div>
        <div th:replace="~{fragments/header :: messages}"></div>

        <form class="card mk-toolbar" method="get" th:action="@{/marketing/posts}">
            <input type="search" name="keyword" th:value="${filter.keyword}" placeholder="Tìm tiêu đề, mã bài viết hoặc email tác giả">
            <select name="visible">
                <option value="">Tất cả trạng thái</option>
                <option value="true" th:selected="${filter.visible == true}">Hiển thị</option>
                <option value="false" th:selected="${filter.visible == false}">Ẩn</option>
            </select>
            <button type="submit">Lọc</button>
        </form>

        <div class="table-wrap">
            <table class="mk-table">
                <thead>
                <tr><th>Ảnh</th><th>Tiêu đề</th><th>Tác giả</th><th>Ngày cập nhật</th><th>Trạng thái</th><th>Thao tác</th></tr>
                </thead>
                <tbody>
                <tr th:if="${page.totalElements == 0}"><td colspan="6" class="empty">Chưa có bài viết.</td></tr>
                <tr th:each="row : ${page.content}">
                    <td><img class="mk-thumb" th:if="${row.thumbnail != null}" th:src="${row.thumbnail}" alt=""></td>
                    <td>
                        <span class="sub" th:text="${row.code}">BV0001</span>
                        <a class="mk-name" th:href="@{|/marketing/posts/${row.id}|}" th:text="${row.title}">Tiêu đề</a>
                    </td>
                    <td th:text="${row.authorName}">Tác giả</td>
                    <td th:text="${#temporals.format(row.updatedAt, 'dd/MM/yyyy')}"></td>
                    <td><span th:replace="~{fragments/header :: visibility(${row.visible})}"></span></td>
                    <td>
                        <div class="mk-row-actions">
                            <a class="mk-link" th:href="@{|/marketing/posts/${row.id}/edit|}" title="Chỉnh sửa" aria-label="Chỉnh sửa"><span th:replace="~{fragments/marketing :: icon('edit')}"></span></a>
                            <a class="mk-link" th:if="${row.visible}" href="#" th:attr="data-open=|hide-${row.id}|">Ẩn</a>
                            <form th:unless="${row.visible}" th:action="@{|/marketing/posts/${row.id}/toggle|}" method="post">
                                <input type="hidden" name="from" value="list">
                                <button class="mk-link" type="submit">Hiện</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/pagination :: pager(${page})}"></nav>

        <!--/* MP05 Xac nhan an bai viet */-->
        <th:block th:each="row : ${page.content}" th:if="${row.visible}">
            <div th:replace="~{fragments/marketing :: hideModal(|hide-${row.id}|, 'Ẩn bài viết?', ${row.title},
                    'Bài viết sẽ không xuất hiện trên website. Nội dung vẫn được giữ nguyên và có thể hiện lại.',
                    @{|/marketing/posts/${row.id}/toggle|}, 'list', 'Ẩn bài viết')}"></div>
        </th:block>
    </div>
</div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
