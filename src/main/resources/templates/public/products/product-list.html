<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/header :: bar}"></div>
<main class="page" id="content">
    <div th:replace="~{fragments/header :: messages}"></div>
    <p class="crumbs"><a th:href="@{/}">Trang chủ</a> / <span>Sản phẩm</span></p>
    <h1>Phụ kiện cho góc làm việc</h1>
    <div class="catalog">
        <aside class="card filter-card">
            <form th:action="@{/products}" method="get">
                <h2>Danh mục</h2>
                <label class="check" th:each="category : ${productCategories != null ? productCategories : T(java.util.Collections).emptyList()}">
                    <input type="checkbox" name="categoryId" th:value="${category.id}" th:checked="${param.categoryId != null && #lists.contains(param.categoryId, '' + category.id)}">
                    <span th:text="${category.name}">Bàn phím</span>
                </label>
                <h2>Khoảng giá</h2>
                <div class="price-range">
                    <input type="number" name="minPrice" min="0" placeholder="Từ" th:value="${param.minPrice != null ? param.minPrice[0] : ''}">
                    <span>-</span>
                    <input type="number" name="maxPrice" min="0" placeholder="Đến" th:value="${param.maxPrice != null ? param.maxPrice[0] : ''}">
                </div>
                <input type="hidden" name="keyword" th:value="${param.keyword != null ? param.keyword[0] : ''}">
                <div class="form-actions" style="margin-top:14px; display:grid;">
                    <button type="submit">Áp dụng</button>
                    <a class="btn btn-ghost" th:href="@{/products}" style="text-align:center;">Xóa bộ lọc</a>
                </div>
            </form>
        </aside>
        <section>
            <div class="toolbar">
                <form class="search-line" th:action="@{/products}" method="get">
                    <input type="search" name="keyword" placeholder="Tìm sản phẩm trong danh mục..." th:value="${param.keyword != null ? param.keyword[0] : ''}">
                    <input type="hidden" name="categoryId" th:if="${param.categoryId != null}" th:value="${param.categoryId[0]}">
                </form>
                <span class="muted" th:if="${page != null}" th:text="|${page.totalElements} sản phẩm|">0 sản phẩm</span>
            </div>
            <div class="grid-3">
                <article class="pcard" th:if="${page != null}" th:each="product : ${page.content}">
                    <a th:href="@{|/products/${product.id}|}">
                        <img class="thumb" th:if="${product.thumbnail != null}" th:src="${product.thumbnail}" th:alt="${product.name}">
                        <div class="ph wide" th:if="${product.thumbnail == null}"></div>
                    </a>
                    <div class="body">
                        <h2 th:text="${product.name}">Sản phẩm</h2>
                        <p class="price"><span th:replace="~{fragments/header :: vnd(${product.currentPrice})}">0</span></p>
                        <p><span class="stock" th:if="${product.stockQuantity > 0}">Còn hàng</span><span class="badge badge-off" th:if="${product.stockQuantity <= 0}">Hết hàng</span></p>
                        <a class="outline" th:href="@{|/products/${product.id}|}">Xem chi tiết →</a>
                    </div>
                </article>
            </div>
            <p class="empty" th:if="${page == null || page.totalElements == 0}">Không có sản phẩm phù hợp.</p>
            <nav th:replace="~{fragments/pagination :: pager(${page})}"></nav>
        </section>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
