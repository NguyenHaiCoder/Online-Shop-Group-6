<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Trang chủ')}"></head>
<body>
<div th:replace="~{fragments/header :: bar}"></div>
<main class="page" id="content">
    <div th:replace="~{fragments/header :: messages}"></div>
    <div class="stack">
        <section class="hero" th:if="${sliders == null || sliders.empty}">
            <div class="hero-copy">
                <h1>Góc làm việc mới.<br>Cảm hứng mới.</h1>
                <p class="muted">Khám phá bộ sưu tập bàn phím, chuột và tai nghe Nova.</p>
                <a class="btn" th:href="@{/products}">Khám phá sản phẩm →</a>
                <div class="dots"><i class="on"></i><i></i><i></i></div>
            </div>
        </section>
        <section class="hero" th:if="${sliders != null && !sliders.empty}">
            <a class="hero-slide" th:each="slider, iter : ${sliders}" th:href="${slider.backlink != null ? slider.backlink : '/products'}" th:style="${iter.index > 0} ? 'display:none' : ''">
                <img th:src="${slider.image}" th:alt="${slider.title}">
            </a>
            <div class="hero-copy">
                <h1 th:text="${sliders[0].title}">Góc làm việc mới.</h1>
                <a class="btn" th:href="@{/products}">Khám phá sản phẩm →</a>
            </div>
        </section>

        <nav class="cat-row" th:if="${productCategories != null}">
            <a class="cat" th:each="category : ${productCategories}" th:href="@{/products(categoryId=${category.id})}">
                <span class="ph"></span>
                <strong th:text="${category.name}">Bàn phím</strong>
                <span class="muted">›</span>
            </a>
        </nav>

        <section>
            <div class="section-head"><h2>Sản phẩm nổi bật</h2><a th:href="@{/products}">Xem tất cả sản phẩm →</a></div>
            <div class="grid-3">
                <article class="pcard hcard" th:each="product : ${featuredProducts}">
                    <a th:href="@{|/products/${product.id}|}">
                        <img class="thumb" th:if="${product.thumbnail != null}" th:src="${product.thumbnail}" th:alt="${product.name}">
                        <div class="ph wide" th:if="${product.thumbnail == null}"></div>
                    </a>
                    <div class="body">
                        <a th:href="@{|/products/${product.id}|}"><h3 th:text="${product.name}">Sản phẩm</h3></a>
                        <p class="price"><span th:replace="~{fragments/header :: vnd(${product.currentPrice})}">0</span></p>
                    </div>
                </article>
            </div>
            <p class="empty" th:if="${featuredProducts == null || featuredProducts.empty}">Chưa có sản phẩm nổi bật.</p>
        </section>

        <section>
            <div class="section-head"><h2>Góc cảm hứng</h2><a th:href="@{/blogs}">Xem tất cả bài viết →</a></div>
            <div class="grid-3" style="grid-template-columns: 1fr 1fr;">
                <article class="bcard hcard" th:each="post : ${hotPosts}">
                    <a th:href="@{|/blogs/${post.id}|}">
                        <img class="thumb" th:if="${post.thumbnail != null}" th:src="${post.thumbnail}" th:alt="${post.title}">
                        <div class="ph wide" th:if="${post.thumbnail == null}"></div>
                    </a>
                    <div class="body">
                        <a th:href="@{|/blogs/${post.id}|}"><h3 th:text="${post.title}">Bài viết</h3></a>
                        <p class="muted" th:text="${post.briefInfo}"></p>
                        <p class="meta" th:text="${#temporals.format(post.updatedAt, 'dd/MM/yyyy')}"></p>
                    </div>
                </article>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/header :: modals('')}"></div>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
