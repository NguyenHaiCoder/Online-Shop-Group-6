spring.application.name=OnlineShop
server.port=8080

# ===== DataSource (SQL Server) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OnlineShopDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== Flyway: tao bang + du lieu ban dau (db/migration/V*__*.sql) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JPA / Hibernate =====
# Flyway quan ly schema, Hibernate chi kiem tra entity khop voi bang
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# String -> NVARCHAR de luu tieng Viet
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ===== Mail (Verify Email, Reset Password) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Upload anh (thumbnail, avatar, product/feedback images) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# ===== App config: du lieu cau hinh 1 lan (xem PROJECT_GUIDE.md muc 3) =====
# Chi dung ky tu ASCII trong file nay (file .properties doc bang ISO-8859-1)
app.base-url=http://localhost:8080
app.page-size=10
app.home.featured-size=8
app.sider.latest-size=5
app.token.verify-email-expiry-minutes=1440
app.token.reset-password-expiry-minutes=30
app.upload.dir=uploads
app.payment.bank-name=Vietcombank
app.payment.account-number=0123456789
app.payment.account-name=CONG TY TNHH ONLINE SHOP
app.payment.transfer-prefix=ONLINESHOP
app.shop.hotline=1900 1234
app.shop.email=support@onlineshop.com
app.shop.address=Ha Noi, Viet Nam
