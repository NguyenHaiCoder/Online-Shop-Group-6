spring.config.import=optional:file:./.env[.properties]
spring.application.name=OnlineShop
server.port=8080

# ===== DataSource (SQL Server) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OnlineShopDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== Flyway: tao bang + du lieu ban dau (db/migration/V*__*.sql) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JPA / Hibernate =====
# Flyway quan ly schema, Hibernate chi kiem tra entity khop voi bang
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# String -> NVARCHAR de luu tieng Viet
spring.jpa.properties.hibernate.use_nationalized_character_data=true


# ===== Thymeleaf =====
spring.thymeleaf.cache=false
logging.level.org.thymeleaf=DEBUG
server.error.include-message=always
server.error.include-stacktrace=always

# ===== Upload anh (thumbnail, avatar, product/feedback images) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Cloudinary. Co the dien thang o day, hoac set bien moi truong CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===== App config: du lieu cau hinh 1 lan (xem PROJECT_GUIDE.md muc 3) =====
# Chi dung ky tu ASCII trong file nay (file .properties doc bang ISO-8859-1)
app.base-url=http://localhost:8080
app.page-size=10
app.home.featured-size=8
app.sider.latest-size=5
app.payment.bank-name=Vietcombank
app.payment.account-number=0123456789
app.payment.account-name=CONG TY TNHH ONLINE SHOP
app.payment.transfer-prefix=ONLINESHOP
app.shop.hotline=1900 1234
app.shop.email=support@onlineshop.com
app.shop.address=Ha Noi, Viet Nam
